[project]
name = "semantic-search-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RakeshNainani", email = "rakeshnainani@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "numpy>=2.5.3",
    "pypdf>=6.19.0",
